name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (root + server)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify build output exists
        run: test -f dist/index.html && echo "dist/index.html present"
